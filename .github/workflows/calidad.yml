# Pipeline de calidad (Modelo V): ejecuta los 4 niveles de prueba en orden y bloquea el merge
# si alguno falla o si la cobertura unitaria baja del umbral (80 % líneas, definido en vitest.config.ts).
name: Calidad

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: calidad-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  JWT_SECRET: secreto-de-ci-solo-para-pruebas-con-mas-de-32-caracteres
  WEB_ORIGIN: http://localhost:3002

jobs:
  estatico:
    name: Lint, arquitectura y tipos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm }
      - run: npm ci
      - run: npx prisma generate --schema apps/api/prisma/schema.prisma
      - run: npm run contracts:generate
      - run: npm run lint
      - run: npm run typecheck

  unitarias:
    name: 'Nivel 1: unitarias + cobertura'
    needs: estatico
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm }
      - run: npm ci
      - run: npx prisma generate --schema apps/api/prisma/schema.prisma
      # Falla si la cobertura baja de los umbrales de vitest.config.ts.
      - run: npm run test:unit
        env: { CI: 'true' }
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: cobertura-unitaria, path: apps/api/reports/unit }

  integracion:
    name: 'Nivel 2: integración (Testcontainers)'
    needs: unitarias
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm }
      - run: npm ci
      - run: npx prisma generate --schema apps/api/prisma/schema.prisma
      # El runner de GitHub tiene Docker: PostgreSQL 16 efímero con Testcontainers.
      - run: npm run test:int
        env: { CI: 'true', USAR_TESTCONTAINERS: '1' }

  sistema-y-aceptacion:
    name: 'Niveles 3 y 4: sistema (E2E), carga y aceptación (UAT)'
    needs: integracion
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres, POSTGRES_DB: lectoaventura_e2e }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CI: 'true'
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/lectoaventura_e2e?schema=public
      PW_CANAL: chromium
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm }
      - run: npm ci
      - run: npx prisma generate --schema apps/api/prisma/schema.prisma
      - run: npx prisma migrate deploy --schema apps/api/prisma/schema.prisma
      - run: npm run contracts:generate
      - run: npx playwright install --with-deps chromium
        working-directory: tests/e2e
      # Se compila una sola vez; E2E, UAT y k6 arrancan la compilación de producción.
      # La compilación de la web descarga las fuentes de Google (next/font): si la red de GitHub falla,
      # se reintenta una vez. Un error de código falla igual las dos veces.
      - name: Compilar API y web
        run: |
          npm run build --workspace @lectoaventura/api
          npm run build --workspace @lectoaventura/web || {
            echo "::warning title=Compilación de la web::Falló (¿descarga de fuentes?); se reintenta una vez"
            sleep 20
            npm run build --workspace @lectoaventura/web
          }
      - name: 'Nivel 3: sistema E2E (escritorio y tablet)'
        run: npm run test:e2e
      - name: 'Nivel 4: aceptación (Gherkin)'
        run: npm run test:uat
      - name: 'Nivel 3: humo de carga con k6 (RNF-001, RNF-003, RNF-008)'
        uses: grafana/setup-k6-action@v1
      # Cada escenario publica sus tiempos como anotación de la ejecución (se ven sin abrir los
      # registros) y, si uno no cumple sus umbrales, igual corren los demás antes de fallar.
      - name: 'Nivel 3: escenarios de carga (tiempos en las anotaciones)'
        run: |
          npm run start --workspace @lectoaventura/api &
          npx wait-on -t 120000 http-get://localhost:3001/api/v1/dev/correos
          fallidos=""
          escenario() {
            nombre="$1"; shift
            k6 run --summary-trend-stats "avg,med,p(95),p(99),max" --summary-export "k6-$nombre.json" "$@" || fallidos="$fallidos $nombre"
            node tests/load/anotar-resumen.mjs "k6-$nombre.json" "$nombre"
          }
          escenario iam-sesiones -e DURACION=30s tests/load/scenarios/iam-sesiones.js
          escenario escuela-panel -e DURACION=30s tests/load/scenarios/escuela-panel.js
          node tests/load/sembrar-biblioteca.mjs
          escenario biblioteca -e DURACION=30s tests/load/scenarios/biblioteca.js
          node tests/load/sembrar-aventura.mjs
          escenario aventura-mapa -e DURACION=30s tests/load/scenarios/aventura-mapa.js
          escenario diagnostico-reto tests/load/scenarios/diagnostico-reto.js
          LECTURA_ID=$(node tests/load/sembrar-lectura.mjs)
          escenario lectura-respuestas -e LECTURA_ID="$LECTURA_ID" tests/load/scenarios/lectura-respuestas.js
          AULA=$(node tests/load/sembrar-seguimiento.mjs)
          escenario seguimiento-panel -e DURACION=30s -e AULA_ID="${AULA% *}" -e EMAIL="${AULA#* }" tests/load/scenarios/seguimiento-panel.js
          FAMILIA=$(node tests/load/sembrar-familia.mjs)
          escenario familia-panel -e DURACION=30s -e EMAIL="$FAMILIA" tests/load/scenarios/familia-panel.js
          if [ -n "$fallidos" ]; then echo "::error title=k6::Umbrales no cumplidos en:$fallidos"; exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reportes-sistema-y-uat
          path: |
            tests/e2e/reportes
            tests/e2e/test-results
